services:
  node_a:
    build: .
    image: confidential-p2p-node:latest
    container_name: node_a
    networks:
      p2p_network:
        ipv4_address: 172.20.0.10
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-c", "source /opt/intel/sgxsdk/environment && ./app --port 8080"]

  node_b:
    image: confidential-p2p-node:latest
    container_name: node_b
    depends_on:
      - node_a
    networks:
      p2p_network:
        ipv4_address: 172.20.0.11
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-c", "source /opt/intel/sgxsdk/environment && ./app --port 8080"]

  node_c:
    image: confidential-p2p-node:latest
    container_name: node_c
    depends_on:
      - node_a
    networks:
      p2p_network:
        ipv4_address: 172.20.0.12
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-c", "source /opt/intel/sgxsdk/environment && ./app --port 8080"]
    environment:
      - NODE_BEHAVIOR=MALICIOUS

  node_d:
    image: confidential-p2p-node:latest
    container_name: node_d
    depends_on:
      - node_a
    networks:
      p2p_network:
        ipv4_address: 172.20.0.13
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-c", "source /opt/intel/sgxsdk/environment && ./app --port 8080"]

  node_e:
    image: confidential-p2p-node:latest
    container_name: node_e
    depends_on:
      - node_a
    networks:
      p2p_network:
        ipv4_address: 172.20.0.14
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-c", "source /opt/intel/sgxsdk/environment && ./app --port 8080"]

  node_f:
    image: confidential-p2p-node:latest
    container_name: node_f
    depends_on:
      - node_a
    networks:
      p2p_network:
        ipv4_address: 172.20.0.15
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-c", "source /opt/intel/sgxsdk/environment && ./app --port 8080"]

  node_g:
    image: confidential-p2p-node:latest
    container_name: node_g
    depends_on:
      - node_a
    networks:
      p2p_network:
        ipv4_address: 172.20.0.16
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-c", "source /opt/intel/sgxsdk/environment && ./app --port 8080"]

networks:
  p2p_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
